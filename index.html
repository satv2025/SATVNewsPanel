<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Panel Admin SATV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://solargentinotv.com.ar/assets/media/images/Logo SATV WEB BETA.ico">

    <link rel="stylesheet" href="assets/css/base.css">
    <!-- Datepicker CSS (NO TOCAR) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/css/datepicker.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="container">

        <header class="topbar">
            <h1>🚀 Admin SATV</h1>
            <button id="logoutBtn" class="danger hidden">Cerrar sesión</button>
        </header>

        <!-- LOGIN -->
        <section id="loginBox" class="card login">
            <h2>Ingresar</h2>
            <input id="email" placeholder="Email">
            <input id="password" type="password" placeholder="Password">
            <button id="loginBtn">Entrar</button>
        </section>

        <!-- DASHBOARD -->
        <section id="dash" class="hidden">

            <!-- FORM -->
            <div class="card formCard">

                <h2 id="formTitle">Nuevo artículo</h2>

                <input id="titulo" placeholder="Título">
                <textarea id="resumen" placeholder="Resumen"></textarea>
                <textarea id="contenido" rows="8" placeholder="Contenido HTML"></textarea>

                <!-- Estado (dropdown custom) -->
                <div class="estadoDropdown" id="estadoDropdown">
                    <div class="estadoSelected" id="estadoSelected">No publicado</div>
                    <div class="estadoMenu hidden" id="estadoMenu">
                        <div class="estadoItem" data-value="borrador">No publicado</div>
                        <div class="estadoItem" data-value="revision">En revisión</div>
                        <div class="estadoItem" data-value="programado">Programado</div>
                        <div class="estadoItem" data-value="publicado">Publicado</div>
                        <div class="estadoItem" data-value="eliminado">Eliminado</div>
                        <div class="estadoItem" data-value="deportes">Deportes</div>
                    </div>
                </div>

                <!-- FECHA DE PUBLICACIÓN CUSTOM -->
                <label>Fecha de publicación</label>
                <div class="customDateTime">
                    <input id="fechaCustomMostrar" class="datePickerInput" placeholder="Seleccionar fecha"
                        autocomplete="off" readonly>
                </div>

                <div class="uploadBox" id="uploadBox">
                    <input type="file" id="imagenFile" hidden>
                    <div class="uploadInner">
                        📷 Subir imagen
                        <span id="fileName">o arrastrar acá</span>
                    </div>
                </div>

                <!-- VIDEOS -->
                <div class="uploadBox" id="videoUploadBox">
                    <input type="file" id="videosInput" hidden multiple accept="video/*">
                    <div class="uploadInner">
                        🎬 Subir videos
                        <span id="videoCount">o arrastrar acá</span>
                    </div>
                </div>

                <div id="uploadProgressBox" class="hidden">
                    <progress id="uploadProgress" value="0" max="100"></progress>
                    <span id="uploadText">Subiendo…</span>
                </div>

                <img id="preview" class="preview hidden">

                <div class="row">
                    <button id="saveBtn">Guardar</button>
                    <button id="cancelEdit" class="secondary hidden">Cancelar edición</button>
                </div>

            </div>

            <!-- LISTA -->
            <div class="card">
                <h2>Artículos</h2>
                <div id="lista" class="grid"></div>
            </div>

        </section>

    </div>
    <!-- Datepicker JS (NO TOCAR) -->
    <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/datepicker-full.min.js"></script>
    <!-- Tu script con la lógica: debe ir DESPUÉS del datepicker -->
    <script src="assets/js/operation.js"></script>
</body>

</html>
